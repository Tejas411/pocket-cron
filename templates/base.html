<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CronAI{% endblock %}</title>
    <meta name="description" content="Personal AI-powered cron job scheduler">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50:  '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>

    <!-- Custom styles -->
    <link rel="stylesheet" href="/static/style.css">

    {% block head %}{% endblock %}
</head>
<body class="h-full bg-slate-950 text-slate-100 font-sans dark">
    {% if authenticated %}
    <!-- Navigation -->
    <nav class="sticky top-0 z-50 border-b border-slate-800/60 bg-slate-950/80 backdrop-blur-xl">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="flex h-16 items-center justify-between">
                <!-- Logo -->
                <a href="/" class="flex items-center gap-3 group">
                    <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-gradient-to-br from-brand-500 to-brand-700 shadow-lg shadow-brand-500/20 group-hover:shadow-brand-500/40 transition-shadow">
                        <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                    <span class="text-lg font-bold text-gradient">CronAI</span>
                </a>

                <!-- Nav links -->
                <div class="flex items-center gap-1">
                    <a href="/" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 transition-colors">
                        Dashboard
                    </a>
                    <a href="/jobs/new" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 transition-colors">
                        New Job
                    </a>
                    <a href="/history" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 transition-colors">
                        History
                    </a>
                    <a href="/settings" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/60 transition-colors">
                        Settings
                    </a>

                    <div class="ml-4 h-6 w-px bg-slate-700/60"></div>

                    <form action="/logout" method="post" class="ml-2">
                        <button type="submit" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-400 hover:text-red-400 hover:bg-red-500/10 transition-colors">
                            Logout
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
    {% endif %}

    <!-- Flash messages -->
    {% if flash_message %}
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 mt-4">
        <div class="rounded-lg border px-4 py-3 text-sm font-medium
            {% if flash_type == 'error' %}
                border-red-500/30 bg-red-500/10 text-red-400
            {% elif flash_type == 'success' %}
                border-emerald-500/30 bg-emerald-500/10 text-emerald-400
            {% else %}
                border-brand-500/30 bg-brand-500/10 text-brand-300
            {% endif %}
        ">
            {{ flash_message }}
        </div>
    </div>
    {% endif %}

    <!-- Main content -->
    <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/40 mt-auto">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-6">
            <p class="text-center text-xs text-slate-600">
                CronAI — AI-powered task scheduling via GitHub Actions
            </p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
